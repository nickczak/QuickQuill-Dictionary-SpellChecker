services:
  backend:
    image: ${DOCKER_IMAGE:-nicksobchak/quickquill}
    restart: unless-stopped
    working_dir: /app
    volumes:
      # :z relabels the bind-mount to container_file_t so the container can read
      # it under SELinux (Fedora). Without it: "Permission denied" on open().
      - ./dictionary.db:/app/dictionary.db:ro,z
    expose:
      - "8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_APPLICATION_JSON={"quickquill":{"dictionary-path":"/app/dictionary.db"}}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/quickquill
      - SPRING_DATASOURCE_USERNAME=quickquill
      - SPRING_DATASOURCE_PASSWORD=quickquill
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/word/test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=quickquill
      - POSTGRES_USER=quickquill
      - POSTGRES_PASSWORD=quickquill
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      # NGINX_CONF selects the local dev site config (dev.conf, plain HTTP).
      # :z same SELinux relabel as above.
      - ./nginx/${NGINX_CONF:-dev.conf}:/etc/nginx/conf.d/default.conf:ro,z
      # :z required so nginx can read the built Angular files under SELinux.
      - ./web/dist/browser:/usr/share/nginx/html:ro,z
      - nginx_data:/var/cache/nginx

volumes:
  nginx_data:
  postgres_data:

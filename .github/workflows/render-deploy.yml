name: Backend Deploy

# Reacts to pushes on main by triggering a deploy of the Render web service
# through the Render API and then waiting for that deploy to go live. Fails
# only when the deploy genuinely fails or the running service does not answer
# /api/health, so the README badge reflects the real backend state.
#
# A push superseded by a newer push is expected: GitHub cancels the older run
# (concurrency group) and Render cancels the older deploy, so the newest run
# owns the final status.
#
# Setup (one time):
#   * Secret   RENDER_API_KEY  — Render dashboard → Account Settings → API Keys
#   * Variable RENDER_SERVICE_ID — the quickquill-backend service id (srv-...)
#   From a service page: the URL is https://dashboard.render.com/web/srv-xxxx.

on:
  push:
    branches: [ main ]

concurrency:
  group: render-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}

jobs:
  deploy-and-verify:
    name: Deploy and verify on Render
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Trigger deploy and wait for live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?Set the RENDER_API_KEY secret in GitHub → Settings → Secrets}"
          : "${RENDER_SERVICE_ID:?Set the RENDER_SERVICE_ID variable in GitHub → Settings → Variables}"
          case "$RENDER_SERVICE_ID" in
            srv-*)
              ;;
            *)
              echo "::error::RENDER_SERVICE_ID must be the service id (srv-...), not the service URL. Got: $RENDER_SERVICE_ID"
              exit 1
              ;;
          esac

          SERVICE_ID="$RENDER_SERVICE_ID"
          API_BASE="https://api.render.com/v1/services/$SERVICE_ID"
          AUTH="Authorization: Bearer $RENDER_API_KEY"

          # --- 1. Trigger the deploy ----------------------------------------
          # Render answers 202 Accepted and returns the new deploy in the body;
          # 200 happens when a deploy is already queued for the same commit.
          POST_BODY=$(mktemp)
          trigger_ok=""
          for attempt in $(seq 1 5); do
            HTTP_CODE=$(curl -sS -o "$POST_BODY" -w '%{http_code}' \
              -H "$AUTH" -H "Content-Type: application/json" -X POST \
              -d "{\"commitId\": \"$COMMIT_SHA\"}" \
              "$API_BASE/deploys" || true)
            if [ "$HTTP_CODE" = "202" ] || [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "deploy trigger accepted (HTTP $HTTP_CODE) on attempt $attempt"
              trigger_ok="yes"
              break
            fi
            echo "trigger attempt $attempt: HTTP $HTTP_CODE"
            sed 's/^/  /' "$POST_BODY" 2>/dev/null || true
            sleep 5
          done
          if [ -z "$trigger_ok" ]; then
            echo "::error::Could not trigger a Render deploy (last HTTP $HTTP_CODE)"
            exit 1
          fi

          # --- 2. Resolve the deploy we own ---------------------------------
          # The 202 body is the deploy object (has "id"); fall back to matching
          # the pushed commit SHA in the deploy list.
          DEPLOY_ID=$(python3 - "$POST_BODY" <<'PY' 2>/dev/null || true
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              data = None
          ident = data.get("id", "") if isinstance(data, dict) else ""
          print(ident if ident.startswith("dep-") else "")
          PY
          )
          if [ -z "$DEPLOY_ID" ]; then
            echo "no deploy id in trigger response; will match by commit SHA"
          else
            echo "deploy id: $DEPLOY_ID"
          fi

          find_deploy() {
            python3 - "$BODY" <<'PY'
          import json, os, sys

          try:
              payload = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("not_found")
              sys.exit(0)

          # Render has returned both a bare list and paginated/enveloped
          # deploy records over time. Normalize both shapes before matching.
          if isinstance(payload, dict):
              deploys = payload.get("deploys", [])
          else:
              deploys = payload
          deploys = [
              item.get("deploy", item)
              for item in deploys
              if isinstance(item, dict)
          ]

          target = os.getenv("DEPLOY_ID", "")
          sha = os.environ["COMMIT_SHA"]
          if target.startswith("dep-"):
              match = next((d for d in deploys if d.get("id") == target), None)
          else:
              match = next(
                  (d for d in deploys if (d.get("commit") or {}).get("id") == sha),
                  None,
              )

          print(match.get("status", "unknown") if match else "not_found")
          PY
          }

          # --- 3. Poll until live --------------------------------------------
          for i in $(seq 1 160); do
            BODY=$(mktemp)
            HTTP_CODE=$(curl -sS -o "$BODY" -w '%{http_code}' -H "$AUTH" \
              "$API_BASE/deploys?limit=20" || true)
            if [ "$HTTP_CODE" != "200" ]; then
              echo "poll attempt $i: Render API returned HTTP $HTTP_CODE"
              sed 's/^/  /' "$BODY" 2>/dev/null || true
            else
              STATUS=$(DEPLOY_ID="$DEPLOY_ID" find_deploy)
              echo "poll attempt $i -> status: $STATUS"
              case "$STATUS" in
                live)
                  echo "::notice::Render deploy is live for commit ${COMMIT_SHA:0:10}"
                  exit 0
                  ;;
                created|queued|build_in_progress|update_in_progress|deploy_in_progress|pre_deploy_in_progress|not_found)
                  ;;
                build_failed|update_failed|deploy_failed|runtime_failed|pre_deploy_failed|destroyed|canceled|cancelled|deploy_cancelled|deactivated)
                  echo "::error::Render deploy failed ($STATUS)"
                  exit 1
                  ;;
              esac
            fi
            sleep 30
          done

          echo "::error::Timed out waiting for the Render deploy to reach live"
          exit 1
      - name: Probe live service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          SERVICE_URL=$(curl -fsS \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID" | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(d.get('serviceDetails',{}).get('liveUrl','') or d.get('serviceDetails',{}).get('url',''))")
          if [ -z "$SERVICE_URL" ]; then
            echo "::error::Could not resolve the service's live URL from the Render API"
            exit 1
          fi
          echo "service url: $SERVICE_URL"

          for i in $(seq 1 15); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SERVICE_URL/api/health" || true)
            echo "health probe $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is live and serving on $SERVICE_URL"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Deploy went live but /api/health did not return 200 at $SERVICE_URL"
          exit 1
name: Backend Deploy

# Reacts to pushes on main by triggering a deploy of the Render web service
# through the Render API and then waiting for that deploy to go live. Fails
# the check only when the deploy genuinely fails or the running service does
# not answer /api/health, so the README badge reflects the real backend state.
#
# A push superseded by a newer push is expected: GitHub cancels the older run
# (concurrency group) and Render cancels the older deploy, so the newest run
# owns the final status.
#
# Setup (one time):
#   * Secret   RENDER_API_KEY  — Render dashboard → Account Settings → API Keys
#   * Variable RENDER_SERVICE_ID — the quickquill-backend service id (srv-...)
#   From a service page: the URL is https://dashboard.render.com/web/srv-xxxx.

on:
  push:
    branches: [ main ]

concurrency:
  group: render-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}

jobs:
  deploy-and-verify:
    name: Deploy and verify on Render
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?Set the RENDER_API_KEY secret in GitHub → Settings → Secrets}"
          : "${RENDER_SERVICE_ID:?Set the RENDER_SERVICE_ID variable in GitHub → Settings → Variables}"
          case "$RENDER_SERVICE_ID" in
            srv-*)
              ;;
            *)
              echo "::error::RENDER_SERVICE_ID must be the service id (srv-...), not the service URL. Got: $RENDER_SERVICE_ID"
              exit 1
              ;;
          esac

          POST_BODY=$(mktemp)
          for i in $(seq 1 5); do
            HTTP_CODE=$(curl -sS -o "$POST_BODY" -w '%{http_code}' \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              -d "{\"commitId\": \"$COMMIT_SHA\"}" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" || true)
            if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "deploy triggered (HTTP $HTTP_CODE)"
              break
            fi
            echo "trigger attempt $i failed (HTTP $HTTP_CODE)"
            sed 's/^/  /' "$POST_BODY" 2>/dev/null || true
            sleep 5
          done
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Could not trigger a Render deploy (last HTTP $HTTP_CODE)"
            exit 1
          fi
      - name: Poll until deploy is live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          DEPLOYS_API="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=10"
          BODY=$(mktemp)

          find_deploy() {
            python3 - "$BODY" <<'PY'
          import json, os, sys
          try:
              deploys = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              sys.stdout.write("no_data\n")
              raise SystemExit
          sha = os.environ["COMMIT_SHA"]
          match = next((d for d in deploys if (d.get("commit") or {}).get("id") == sha), None)
          if match is None:
              sys.stdout.write("not_found\n")
          else:
              sys.stdout.write(match.get("status", "unknown") + "\n")
          PY
          }

          for i in $(seq 1 160); do
            HTTP_CODE=$(curl -sS -o "$BODY" -w '%{http_code}' \
              -H "Authorization: Bearer $RENDER_API_KEY" "$DEPLOYS_API" || true)
            if [ "$HTTP_CODE" != "200" ]; then
              echo "poll attempt $i: Render API returned HTTP $HTTP_CODE"
              sed 's/^/  /' "$BODY" 2>/dev/null || true
              sleep 30
              continue
            fi

            STATUS=$(find_deploy)
            echo "poll attempt $i -> commit ${COMMIT_SHA:0:10}: $STATUS"

            case "$STATUS" in
              live)
                echo "Render deploy is live for commit ${COMMIT_SHA:0:10}"
                exit 0
                ;;
              created|build_in_progress|update_in_progress|deploy_in_progress|not_found|no_data)
                sleep 30
                ;;
              build_failed|update_failed|deploy_failed|runtime_failed|pre_deploy_failed|destroyed|canceled|deploy_cancelled)
                echo "::error::Render deploy failed ($STATUS)"
                exit 1
                ;;
              *)
                sleep 30
                ;;
            esac
          done

          echo "::error::Timed out waiting for the Render deploy to reach live"
          exit 1
      - name: Probe live service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          SERVICE_URL=$(curl -fsS \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID" | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(d.get('serviceDetails',{}).get('liveUrl','') or d.get('serviceDetails',{}).get('url',''))")
          if [ -z "$SERVICE_URL" ]; then
            echo "::error::Could not resolve the service's live URL from the Render API"
            exit 1
          fi
          echo "service url: $SERVICE_URL"

          for i in $(seq 1 15); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SERVICE_URL/api/health" || true)
            echo "health probe $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is live and serving on $SERVICE_URL"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Deploy went live but /api/health did not return 200 at $SERVICE_URL"
          exit 1
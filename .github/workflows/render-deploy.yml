name: Backend Deploy

# Watches the Render blueprint redeploy triggered by the same push and fails
# only when the deploy genuinely fails, so the README badge reflects the real
# backend state. Render's blueprint auto-deploys on push to main (render.yaml
# autoDeploy: true); this workflow just polls the Render API for the deploy
# matching the pushed commit SHA.
#
# A push is superseded when a newer push lands while its deploy is still
# building: Render cancels the older deploy and GitHub cancels the older run,
# so "deploy_cancelled"/superseded is expected and reported as success (the
# newest deploy's own run owns the final status). Only build_failed /
# update_failed / runtime_failed are real failures.
#
# Setup (one time):
#   * Secret   RENDER_API_KEY  — Render dashboard → Account Settings → API Keys
#   * Variable RENDER_SERVICE_ID — the quickquill-backend service id (srv-...)
#   From a service page: the URL is https://dashboard.render.com/web/srv-xxxx.

on:
  push:
    branches: [ main ]

concurrency:
  group: render-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}

jobs:
  wait-for-render:
    name: Wait for Render deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Poll Render deploy status
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?Set the RENDER_API_KEY secret in GitHub → Settings → Secrets}"
          : "${RENDER_SERVICE_ID:?Set the RENDER_SERVICE_ID variable in GitHub → Settings → Variables}"
          case "$RENDER_SERVICE_ID" in
            srv-*)
              ;;
            *)
              echo "::error::RENDER_SERVICE_ID must be the service id (srv-...), not the service URL. Got: $RENDER_SERVICE_ID"
              exit 1
              ;;
          esac

          DEPLOYS_API="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=30"
          SERVICE_API="https://api.render.com/v1/services/$RENDER_SERVICE_ID"
          SERVICE_BODY=/tmp/service_body.json
          DEPLOY_BODY=/tmp/deploy_body.json
          PARSE_OUTPUT=/tmp/parse.out

          # Resolve the public service URL once so we can probe /api/health
          # after the deploy goes live.
          SERVICE_URL=""
          if curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" "$SERVICE_API" -o "$SERVICE_BODY"; then
            SERVICE_URL=$(python3 - "$SERVICE_BODY" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(data.get("serviceDetails", {}).get("liveUrl", "") or data.get("serviceDetails", {}).get("url", ""))
          PY
            )
          fi

          for i in $(seq 1 160); do
            HTTP_CODE=$(curl -sS -o "$DEPLOY_BODY" -w '%{http_code}' \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$DEPLOYS_API")
            echo "render api http: $HTTP_CODE (attempt $i)"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Render API returned HTTP $HTTP_CODE for $DEPLOYS_API"
              echo "response body:"
              sed 's/^/  /' "$DEPLOY_BODY" 2>/dev/null || true
              exit 1
            fi

            COMMIT_SHA="$COMMIT_SHA" python3 - "$DEPLOY_BODY" > "$PARSE_OUTPUT"
            MATCH_STATUS=$(sed -n '1p' "$PARSE_OUTPUT")
            LATEST_STATUS=$(sed -n '2p' "$PARSE_OUTPUT")
            IS_LATEST=$(sed -n '3p' "$PARSE_OUTPUT")
            echo "deploy(${COMMIT_SHA:0:10}): $MATCH_STATUS | latest: $LATEST_STATUS | is_latest: $IS_LATEST"

            case "$MATCH_STATUS" in
              live)
                if [ "$IS_LATEST" = "yes" ]; then
                  echo "Render deploy succeeded for commit ${COMMIT_SHA:0:10}"
                  exit 0
                fi
                # Our deploy is live but superseded by a newer one; the newer
                # commit's run owns the final result, so report success here.
                echo "::warning::Render deploy went live and was superseded by a newer push; finalized by that run"
                exit 0
                ;;
              not_found)
                # Render usually has not recorded the deploy on the very first
                # poll (it appears after the GitHub hook is processed).
                sleep 30
                continue
                ;;
              deploy_cancelled|canceled|superseded)
                if [ "$IS_LATEST" = "yes" ]; then
                  echo "::error::Render deploy was cancelled for the latest commit ($MATCH_STATUS)"
                  exit 1
                fi
                echo "Render deploy superseded by a newer push; success"
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|deploy_failed|runtime_failed|destroyed)
                echo "::error::Render deploy failed ($MATCH_STATUS)"
                exit 1
                ;;
              in_progress|created|building|deploying|pending|*)
                sleep 30
                ;;
            esac
          done

          echo "::error::Timed out waiting for the Render deploy to finish"
          exit 1
      - name: Probe service health
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Re-resolve the live URL (also landed in step 1, but cheap to fetch).
          SERVICE_URL=$(curl -fsS \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID" | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(d.get('serviceDetails',{}).get('liveUrl','') or d.get('serviceDetails',{}).get('url',''))")
          echo "service url: $SERVICE_URL"

          if [ -z "$SERVICE_URL" ]; then
            echo "::error::Could not resolve the service's live URL from the Render API"
            exit 1
          fi

          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SERVICE_URL/api/health" || true)
            echo "health probe ($i): http $code"
            if [ "$code" = "200" ]; then
              echo "Backend is live and serving on $SERVICE_URL"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Deploy went live but /api/health did not return 200 at $SERVICE_URL"
          exit 1
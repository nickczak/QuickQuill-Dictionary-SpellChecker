name: Backend Deploy

# Watches the Render blueprint redeploy triggered by the same push and fails
# if the deploy does not go live, so the README badge reflects the real
# backend state. Render's blueprint auto-deploys on push to main (render.yaml
# autoDeploy: true); this workflow just polls the Render API for the deploy
# matching the pushed commit SHA.
#
# Setup (one time):
#   * Secret   RENDER_API_KEY  — Render dashboard → Account Settings → API Keys
#   * Variable RENDER_SERVICE_ID — the quickquill-backend service id (srv-...)
#   From a service page: the URL is https://dashboard.render.com/web/srv-xxxx.

on:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}

jobs:
  wait-for-render:
    name: Wait for Render deploy
    runs-on: ubuntu-latest
    steps:
      - name: Poll Render deploy status
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?Set the RENDER_API_KEY secret in GitHub → Settings → Secrets}"
          : "${RENDER_SERVICE_ID:?Set the RENDER_SERVICE_ID variable in GitHub → Settings → Variables}"
          case "$RENDER_SERVICE_ID" in
            srv-*)
              ;;
            *)
              echo "::error::RENDER_SERVICE_ID must be the service id (srv-...), not the service URL. Got: $RENDER_SERVICE_ID"
              exit 1
              ;;
          esac

          HTTP_CODE=/tmp/http_code.txt
          DEPLOY_BODY=/tmp/deploy_body.json
          PARSED_STATUS=/tmp/parsed_status.txt
          API_URL="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=5"

          for i in $(seq 1 80); do
            curl -sS -o "$DEPLOY_BODY" -w '%{http_code}' \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$API_URL" > "$HTTP_CODE"

            http_code=$(cat "$HTTP_CODE")
            echo "render api http: $http_code"

            if [ "$http_code" != "200" ]; then
              echo "::error::Render API returned HTTP $http_code for $API_URL"
              echo "response body:"
              sed 's/^/  /' "$DEPLOY_BODY" 2>/dev/null || true
              exit 1
            fi

            COMMIT_SHA="$COMMIT_SHA" python3 - "$DEPLOY_BODY" > "$PARSED_STATUS" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              raw = fh.read()
          try:
              deploys = json.loads(raw)
          except json.JSONDecodeError:
              print("not_found")
              print("unexpected response body:", file=sys.stderr)
              print(raw[:2000], file=sys.stderr)
          else:
              sha = os.environ["COMMIT_SHA"]
              for dep in deploys:
                  if dep.get("commit", {}).get("id") == sha:
                      print(dep["status"])
                      break
              else:
                  print("not_found")
          PY

            status=$(cat "$PARSED_STATUS")
            echo "deploy status: $status"

            case "$status" in
              live)
                echo "Render deploy succeeded"
                exit 0
                ;;
              deploy_cancelled|build_failed|update_failed|canceled)
                echo "::error::Render deploy failed ($status)"
                exit 1
                ;;
            esac

            sleep 30
          done

          echo "::error::Timed out waiting for the Render deploy to finish"
          exit 1
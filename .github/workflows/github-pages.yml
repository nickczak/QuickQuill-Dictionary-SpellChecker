name: Deploy Frontend to GitHub Pages

# Builds the Angular app and publishes it to the gh-pages branch, which hosts
# the QuickQuill frontend (Settings → Pages → Deploy from a branch → gh-pages
# / root). The backend runs on Render and redeploys itself from the same push
# via the blueprint webhook (see render.yaml).
#
# The API base URL is baked into the build from web/src/environments/environment.prod.ts.
# Override it without a code change by setting the repository/org variable
# BACKEND_URL (Settings → Secrets and variables → Actions → Variables) to the
# Render service URL, e.g. https://quickquill-backend-xxxx.onrender.com.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Point the app at the Render backend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          set -euo pipefail
          if [ -n "${BACKEND_URL:-}" ]; then
            node -e '
              const fs = require("fs");
              const file = "web/src/environments/environment.prod.ts";
              const customUrl = process.env.BACKEND_URL.replace(/\/+$/, "");
              let src = fs.readFileSync(file, "utf8");
              src = src.replace(/apiBaseUrl:\s*'\''[^'\'']*'\''/, `apiBaseUrl: '${customUrl}'`);
              fs.writeFileSync(file, src);
            '
          fi

      - name: Build the Angular app
        run: |
          cd web
          npm ci
          # production (API URL file replacement) + gh-pages (baseHref subpath)
          npm run build -- --configuration production,gh-pages

      - name: Verify frontend output
        run: |
          test -f web/dist/browser/index.html || { echo "ERROR: index.html not found"; exit 1; }

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist/browser
name: Backend Deploy

# Reacts to pushes on main by waiting for the Northflank combined service
# (quickquill-backend) to build and deploy the pushed commit, then probing
# GET /api/health on the live service. Fails only when the build or rollout
# genuinely fails or the running backend does not answer, so the README badge
# reflects the real backend state.
#
# Northflank's combined service has CI/CD built in: it builds the pushed
# commit automatically. This workflow does NOT trigger a deploy — it watches
# the build and deployment status through the Northflank API and verifies the
# result. A push superseded by a newer push is expected: GitHub cancels the
# older run (concurrency group), and the newest run owns the final status.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: northflank-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NORTHFLANK_PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
  NORTHFLANK_SERVICE_ID: ${{ vars.NORTHFLANK_SERVICE_ID }}

jobs:
  deploy-and-verify:
    name: Deploy and verify on Northflank
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait for Northflank build and deployment
        env:
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${NORTHFLANK_API_KEY:?Set the NORTHFLANK_API_KEY secret in GitHub → Settings → Secrets}"
          : "${NORTHFLANK_PROJECT_ID:?Set the NORTHFLANK_PROJECT_ID variable in GitHub → Settings → Variables}"
          : "${NORTHFLANK_SERVICE_ID:?Set the NORTHFLANK_SERVICE_ID variable in GitHub → Settings → Variables}"

          API_BASE="https://api.northflank.com/v1/projects/$NORTHFLANK_PROJECT_ID/services/$NORTHFLANK_SERVICE_ID"
          AUTH="Authorization: Bearer $NORTHFLANK_API_KEY"

          # --- 1. Wait for the build of this commit -------------------------
          for i in $(seq 1 180); do
            BODY=$(mktemp)
            HTTP_CODE=$(curl -sS -o "$BODY" -w '%{http_code}' -H "$AUTH" \
              "$API_BASE/build?per_page=30" || true)
            if [ "$HTTP_CODE" != "200" ]; then
              echo "build poll $i: Northflank API returned HTTP $HTTP_CODE"
            else
              STATUS=$(python3 - "$BODY" <<'PY'
          import json, os, sys
          try:
              builds = json.load(open(sys.argv[1], encoding="utf-8"))["data"]["builds"]
          except Exception:
              builds = []
          sha = os.environ["COMMIT_SHA"]
          match = next((b for b in builds if b.get("sha") == sha), None)
          print(match.get("status", "NOT_FOUND") if match else "NOT_FOUND")
          PY
              )
              echo "build poll $i -> status: $STATUS"
              case "$STATUS" in
                SUCCESS)
                  echo "::notice::Northflank build succeeded for commit ${COMMIT_SHA:0:10}"
                  break
                  ;;
                QUEUED|PENDING|UNSCHEDULABLE|STARTING|CLONING|BUILDING|UPLOADING|IN_PROGRESS|NOT_FOUND)
                  ;;
                ABORTED|FAILURE|SUBMISSION_FAILURE|CRASHED)
                  echo "::error::Northflank build failed for commit ${COMMIT_SHA:0:10} ($STATUS)"
                  exit 1
                  ;;
                *)
                  echo "build poll $i: unexpected status $STATUS"
                  ;;
              esac
            fi
            if [ "$i" = "180" ]; then
              echo "::error::Timed out waiting for the Northflank build to succeed"
              exit 1
            fi
            sleep 30
          done

          # --- 2. Wait for the rollout to complete ---------------------------
          for j in $(seq 1 60); do
            BODY=$(mktemp)
            HTTP_CODE=$(curl -sS -o "$BODY" -w '%{http_code}' -H "$AUTH" "$API_BASE" || true)
            if [ "$HTTP_CODE" != "200" ]; then
              echo "deploy poll $j: Northflank API returned HTTP $HTTP_CODE"
            else
              STATUS=$(python3 - "$BODY" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))["data"]
              print(data.get("status", {}).get("deployment", {}).get("status", "UNKNOWN"))
          except Exception:
              print("UNKNOWN")
          PY
              )
              echo "deploy poll $j -> status: $STATUS"
              case "$STATUS" in
                COMPLETED)
                  echo "::notice::Northflank deployment completed for commit ${COMMIT_SHA:0:10}"
                  exit 0
                  ;;
                PENDING|IN_PROGRESS|UNKNOWN)
                  ;;
                FAILED)
                  echo "::error::Northflank deployment failed for commit ${COMMIT_SHA:0:10}"
                  exit 1
                  ;;
                *)
                  echo "deploy poll $j: unexpected status $STATUS"
                  ;;
              esac
            fi
            sleep 30
          done

          echo "::error::Timed out waiting for the Northflank deployment to complete"
          exit 1
      - name: Probe live service
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          set -euo pipefail
          HEALTH_URL="${BACKEND_HEALTH_URL:-https://api.quickquill.ink/api/health}"
          for i in $(seq 1 20); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$HEALTH_URL" || true)
            echo "health probe $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is live and serving on $HEALTH_URL"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Deployment completed but $HEALTH_URL did not return 200"
          exit 1
spring.application.name=studio
server.port=8080
# Keep credentials and session tokens out of framework request and SQL bind logs.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
# Cross-origin callers of the REST API. The Angular app is served from Vercel
# at its custom domain; the browser blocks requests to the backend without CORS.
# Comma-separated origins.
# Override with CORS_ALLOWED_ORIGINS (e.g. multiple origins for staging).
quickquill.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://quickquill.ink}
# Dictionary database path. Override with QUICKQUILL_DICTIONARY_PATH (e.g.
# /app/dictionary.db in the container image, which bakes the DB in).
quickquill.dictionary-path=${QUICKQUILL_DICTIONARY_PATH:../dictionary.db}
spring.jpa.hibernate.ddl-auto=update
# Pin the dialect so Hibernate never needs an initial "dialect probe" JDBC
# connection at boot. Without it, a DB that is down/unreachable at startup
# fails with the misleading "Unable to determine Dialect without JDBC
# metadata" instead of the real connection error.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Datasource. For Neon, set DB_URL to a jdbc:postgresql://host:5432/db URL
# and supply DB_USERNAME/DB_PASSWORD separately. DataSourceUrlNormalizer also
# accepts postgres:// URLs, but drops embedded credentials.
# Without DB_URL the URL is assembled from parts for local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickquill}}
spring.datasource.username=${DB_USERNAME:quickquill}
spring.datasource.password=${DB_PASSWORD:quickquill}
# DB TLS mode, configurable per environment. Set DB_SSLMODE=require for Neon;
# localhost builds use plaintext.
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSLMODE:disable}

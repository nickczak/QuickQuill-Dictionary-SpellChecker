spring.application.name=studio
server.port=8080
# Cross-origin callers of the REST API. The Angular app is served from GitHub
# Pages (https://<user>.github.io or a custom domain); the browser blocks
# requests to the Render backend without CORS. Comma-separated origins.
# Override with CORS_ALLOWED_ORIGINS (e.g. multiple origins for staging).
quickquill.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://nickczak.github.io}
# Dictionary database path. Override with QUICKQUILL_DICTIONARY_PATH (e.g.
# /app/dictionary.db in the container image, which bakes the DB in).
quickquill.dictionary-path=${QUICKQUILL_DICTIONARY_PATH:../dictionary.db}
spring.jpa.hibernate.ddl-auto=update
# Datasource. DB_URL (a full JDBC URL) wins when set (e.g. Render); otherwise
# the JDBC URL is assembled from parts (Render Blueprint: DB_HOST/DB_PORT/
# DB_NAME from the database's fromDatabase properties, since its
# connectionString is a non-JDBC postgres:// URL that DataSourceUrlNormalizer
# rewrites into jdbc:postgresql://host:5432/db, dropping embedded credentials).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickquill}}
spring.datasource.username=${DB_USERNAME:quickquill}
spring.datasource.password=${DB_PASSWORD:quickquill}
# DB TLS mode, configurable per environment. Managed databases (e.g. Render
# Postgres) commonly REQUIRE TLS; localhost builds use plaintext. Override
# with DB_SSLMODE=require as needed.
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSLMODE:disable}

# Render Blueprint for the QuickQuill backend.
#
# The Angular frontend deploys to GitHub Pages (.github/workflows/github-pages.yml);
# only the backend runs on Render.
#
# Deploy: in the Render dashboard, create a new Blueprint pointing at this
# repo (or `render blueprint` from the CLI). Render provisions the managed
# Postgres and the backend web service below and auto-redeploys them on push
# to main.
#
# Notes:
#   * Render builds ./Dockerfile directly. A multi-stage Dockerfile is fine —
#     the final stage is the runtime image.
#   * Render defaults the expected HTTP port to 10000 (the PORT env var) and
#     stalls a deploy when the app is actually listening elsewhere. Spring Boot
#     binds 8080 (server.port), so PORT is overridden to match.
#   * No healthCheckPath: on a cold free instance the app can take ~90s to
#     serve, and a health check trailing that window keeps failing and gets
#     the service suspended (learned the hard way). Render marks the deploy
#     Live once the port accepts connections; GET /api/health is available for
#     manual probing.
#   * Free web instances have no persistent disk, so dictionary.db is baked
#     into the image. It is NOT committed to the repo: the Dockerfile pulls it
#     from the GitHub release asset "dictionary-common.db" at build time and
#     verifies its SHA256 (see DICTIONARY_DB_URL / DICTIONARY_DB_SHA256 in
#     the Dockerfile).
#   * The web service and the database are pinned to the SAME region (region:
#     oregon). Render resolves a managed database's internal hostname only
#     within its own region; a region mismatch shows up as Hikari failing to
#     reach the DB at boot ("Unable to determine Dialect"). Change both
#     regions together if you take the app to another region.
#   * CORS_ALLOWED_ORIGINS must be the exact browser origin of the site calling
#     the API: https://quickquill.ink (the GitHub Pages custom domain). Add
#     more origins as a comma-separated list if the frontend is also served
#     from a second domain.

services:
  - type: web
    name: quickquill-backend
    runtime: docker
    repo: https://github.com/nickczak/QuickQuill-Dictionary-SpellChecker
    region: oregon
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Spring Boot binds server.port=8080; align Render's expected port so it
      # routes traffic there instead of the default 10000.
      - key: PORT
        value: "8080"
      - key: QUICKQUILL_DICTIONARY_PATH
        value: /app/dictionary.db
      - key: DB_SSLMODE
        value: require
      # Frontend origin (GitHub Pages custom domain) allowed to call this backend.
      # GitHub auto-redirects www.quickquill.ink to the apex, so only the apex
      # is needed here.
      - key: CORS_ALLOWED_ORIGINS
        value: https://quickquill.ink
      # Render's connectionString is a non-JDBC postgres:// URL; it is the
      # single source of truth for host/port/database and is rewritten into a
      # JDBC URL by DataSourceUrlNormalizer (which drops the embedded
      # credentials). DB_USERNAME/DB_PASSWORD below carry the credentials.
      - key: DB_URL
        fromDatabase:
          name: quickquill-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: quickquill-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: quickquill-db
          property: password

databases:
  - name: quickquill-db
    region: oregon
    plan: free
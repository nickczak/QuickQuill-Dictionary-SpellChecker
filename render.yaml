# Render Blueprint for the QuickQuill backend.
#
# The Angular frontend deploys to Vercel; only the backend runs on Render.
#
# Deploy: in the Render dashboard, create a new Blueprint pointing at this
# repo. Render provisions the backend web service below; Postgres is hosted
# on Neon. Deployments are triggered by the repository's Render GitHub Actions
# workflow. See docs/neon-migration.md before switching an existing service.
#
# Notes:
#   * Render builds ./Dockerfile directly. A multi-stage Dockerfile is fine —
#     the final stage is the runtime image.
#   * Render defaults the expected HTTP port to 10000 (the PORT env var) and
#     stalls a deploy when the app is actually listening elsewhere. Spring Boot
#     binds 8080 (server.port), so PORT is overridden to match.
#   * No healthCheckPath: on a cold free instance the app can take ~90s to
#     serve, and a health check trailing that window keeps failing and gets
#     the service suspended (learned the hard way). Render marks the deploy
#     Live once the port accepts connections; GET /api/health is available for
#     manual probing.
#   * Free web instances have no persistent disk, so dictionary.db is built
#     from Kaikki's compressed English Wiktextract export and baked into the
#     image. The Dockerfile verifies the pinned source SHA256, imports the
#     data, then adds custom entries from scripts/import_extras.py.
#   * Neon is reached over its public TLS endpoint. Choose a nearby Neon
#     region to limit latency from this Oregon web service.
#   * CORS_ALLOWED_ORIGINS must be the exact browser origin of the site calling
#     the API: https://quickquill.ink (the Vercel custom domain). Add more
#     origins as a comma-separated list if the frontend is also served from a
#     second domain.

services:
  - type: web
    name: quickquill-backend
    runtime: docker
    repo: https://github.com/nickczak/QuickQuill-Dictionary-SpellChecker
    region: oregon
    # Deploys are triggered and verified by .github/workflows/render-deploy.yml.
    # Keeping this off prevents a push from creating a duplicate Render deploy.
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Spring Boot binds server.port=8080; align Render's expected port so it
      # routes traffic there instead of the default 10000.
      - key: PORT
        value: "8080"
      - key: QUICKQUILL_DICTIONARY_PATH
        value: /app/dictionary.db
      - key: DB_SSLMODE
        value: require
      # Frontend origin (Vercel custom domain) allowed to call this backend.
      # Keep the API's allowed origin aligned with the Vercel production domain.
      - key: CORS_ALLOWED_ORIGINS
        value: https://quickquill.ink
      # Set Neon credentials in the Render dashboard. DB_URL should be:
      # jdbc:postgresql://<neon-host>:5432/<database>?sslmode=require
      # Keep username/password in their separate variables below.
      # sync:false only prompts on initial Blueprint creation. For an
      # existing service, replace all three values manually at cutover.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

# QuickQuill production stack (used by scripts/deploy_docker.sh on the VPS).
#
# Design notes:
# - network_mode: host — the containers bind host ports directly (backend on
#   8080, nginx on 80/443). This lets the backend reach the VPS's host
#   PostgreSQL over localhost:5432, so existing user data keeps living in the
#   host database (no data migration and no 5432 port conflict).
# - Images are built and pushed by the GitHub Actions deploy workflow; the VPS
#   only pulls. DOCKER_TAG pins the exact commit that was built.
# - DB credentials are injected at deploy time from GitHub secrets via the
#   compose environment (never committed).
#
# Deployment:  sudo DOCKER_TAG=... docker compose -f compose.prod.yml up -d

name: quickquill

services:
  backend:
    image: ${DOCKER_IMAGE_BACKEND:-nicksobchak/quickquill-backend}:${DOCKER_TAG:-latest}
    restart: unless-stopped
    network_mode: host
    # e2-micro has ~1GB RAM: cap the container so the JVM sizes its heap to fit
    # (without a limit the JVM ergonomically picks ~250MB heap and the box swaps).
    mem_limit: 320m
    working_dir: /app
    volumes:
      # :z relabels the bind-mount to container_file_t so the container can read
      # it under SELinux (Fedora). Without it: "Permission denied" on open().
      - ./dictionary.db:/app/dictionary.db:ro,z
    environment:
      - SERVER_PORT=8080
      - SPRING_APPLICATION_JSON={"quickquill":{"dictionary-path":"/app/dictionary.db"}}
      - SPRING_DATASOURCE_URL=${DB_URL:?DB_URL not set}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:?DB_USERNAME not set}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD not set}

  nginx:
    image: ${DOCKER_IMAGE_FRONTEND:-nicksobchak/quickquill-frontend}:${DOCKER_TAG:-latest}
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
    volumes:
      # Let's Encrypt certs + certbot webroot must stay readable from the host.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
